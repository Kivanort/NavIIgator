name: CI and Publish Home Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naviigator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Check types and request validation
        run: |
          npm run typecheck
          npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build the production image
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          docker build --platform linux/amd64 \
            --build-arg APP_REVISION="$GITHUB_SHA" \
            --label org.opencontainers.image.source=https://github.com/Kivanort/NavIIgator \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "naviigator-ci:$GITHUB_SHA" .
      - name: Smoke test the isolated image without AI credentials
        run: |
          set -euo pipefail
          container="naviigator-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" --network none \
            --user 1001:1001 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,size=32m,uid=1001,gid=1001 \
            --env "APP_REVISION=$GITHUB_SHA" "naviigator-ci:$GITHUB_SHA"
          docker exec --interactive "$container" node --input-type=module - < scripts/smoke-image.mjs
      - name: Package the verified image and manifest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Kivanort/NavIIgator'
        run: |
          set -euo pipefail
          mkdir -p bundle
          docker save "naviigator-ci:$GITHUB_SHA" | gzip -n > bundle/naviigator-image.tar.gz
          IMAGE_ID=$(docker image inspect --format '{{.Id}}' "naviigator-ci:$GITHUB_SHA")
          export IMAGE_ID
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          commit = os.environ["GITHUB_SHA"]
          image_id = os.environ["IMAGE_ID"]
          assert re.fullmatch(r"[0-9a-f]{40}", commit)
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", image_id)
          archive = Path("bundle/naviigator-image.tar.gz")
          digest = hashlib.sha256()
          with archive.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          manifest = {
              "schema_version": 1,
              "repository": "Kivanort/NavIIgator",
              "commit": commit,
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "image_tag": f"naviigator-ci:{commit}",
              "image_id": image_id,
              "archive_name": archive.name,
              "archive_sha256": digest.hexdigest(),
              "archive_size": archive.stat().st_size,
          }
          Path("bundle/deploy-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Pass the verified bundle to the publisher
        id: bundle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Kivanort/NavIIgator'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bundle/naviigator-image.tar.gz
            bundle/deploy-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.repository == 'Kivanort/NavIIgator' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This job never checks out or executes application code.
      - name: Download exactly the verified artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: bundle
      - name: Validate the bundle before publication
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          directory = Path("bundle")
          assert {p.name for p in directory.iterdir()} == {"deploy-manifest.json", "naviigator-image.tar.gz"}
          manifest_path = directory / "deploy-manifest.json"
          assert manifest_path.is_file() and not manifest_path.is_symlink()
          assert manifest_path.stat().st_size < 16384
          manifest = json.loads(manifest_path.read_text())
          commit = os.environ["GITHUB_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", commit)
          assert manifest["schema_version"] == 1
          assert manifest["repository"] == "Kivanort/NavIIgator"
          assert manifest["commit"] == commit
          assert manifest["run_id"] == int(os.environ["GITHUB_RUN_ID"])
          assert manifest["run_attempt"] == int(os.environ["GITHUB_RUN_ATTEMPT"])
          assert manifest["image_tag"] == f"naviigator-ci:{commit}"
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", manifest["image_id"])
          assert manifest["archive_name"] == "naviigator-image.tar.gz"
          assert re.fullmatch(r"[0-9a-f]{64}", manifest["archive_sha256"])
          archive = directory / "naviigator-image.tar.gz"
          assert archive.is_file() and not archive.is_symlink()
          assert 0 < archive.stat().st_size == manifest["archive_size"] <= 1024 ** 3
          digest = hashlib.sha256()
          with archive.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          assert digest.hexdigest() == manifest["archive_sha256"]
          PY
      - name: Publish the public home release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository=Kivanort/NavIIgator
          tag="home-$GITHUB_SHA"
          if gh release view "$tag" --repo "$repository" >/dev/null 2>&1; then
            actual=$(gh api "repos/$repository/commits/$tag" --jq .sha)
            [[ "$actual" == "$GITHUB_SHA" ]]
            allowed=$(gh release view "$tag" --repo "$repository" --json assets --jq 'all(.assets[]; .name == "deploy-manifest.json" or .name == "naviigator-image.tar.gz")')
            [[ "$allowed" == true ]]
          else
            printf 'Verified container for commit `%s`. Deployment is performed by the private server after this workflow succeeds.\n' "$GITHUB_SHA" > release-notes.md
            gh release create "$tag" --repo "$repository" --target "$GITHUB_SHA" \
              --draft --prerelease --title "Home deployment $GITHUB_SHA" --notes-file release-notes.md
          fi
          gh release upload "$tag" --repo "$repository" --clobber \
            bundle/naviigator-image.tar.gz bundle/deploy-manifest.json
          gh release edit "$tag" --repo "$repository" --draft=false --prerelease --latest=false
          printf 'Published verified bundle: https://github.com/%s/releases/tag/%s\n' "$repository" "$tag" >> "$GITHUB_STEP_SUMMARY"
